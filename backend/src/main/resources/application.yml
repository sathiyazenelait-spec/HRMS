server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: zenelait-hrms-backend
  profiles:
    active: mock-services
  sql:
    init:
      mode: always
      schema-locations: file:db/schema.sql

  # MySQL Configuration
  datasource:
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/zenelait_hrms?useSSL=true&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: 4ZDgjiN8eqjM3sn.root
    password: MNpFyFR12a7XNq3h
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: hrms-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Enable Virtual Threads (Spring Boot 3.2+ on Java 21+)
  threads:
    virtual:
      enabled: true

# Logging Configurations
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    com.zenelait.hrms: DEBUG

---
spring:
  config:
    activate:
      on-profile: mock-services
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  cache:
    type: simple
